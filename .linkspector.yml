# Mirrors the default configuration generated by
# SchmiedmayerLab/.github/.github/workflows/markdown-links.yml, with one
# addition: api.reuse.software answers 424 for repositories its crawler has
# not indexed, so the REUSE badge's link target in README.md is unreachable
# to the link checker even though the badge image itself resolves (200).
dirs:
  - .
useGitIgnore: true
ignorePatterns:
  - pattern: '^doc:.*$'
  - pattern: '^http://localhost.*$'
  - pattern: '^https://api\.reuse\.software/.*$'
replacementPatterns:
  - pattern: '(.*)#gh-dark-mode-only'
    replacement: '$1'
  - pattern: '(.*)#gh-light-mode-only'
    replacement: '$1'
