name: Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Dependencies
        run: npm run install
      - name: Build
        run: npm run build
      - name: Lint Typescript files with ESLint
        run: npm run lint:strict
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          pip install -r nudge-generation/python_service/requirements.txt
          pip install -r nudge-evaluation/requirements.txt
      - name: Install pyrefly
        run: pip install pyrefly
      - name: Lint Python files with Pyrefly
        run: pyrefly check
